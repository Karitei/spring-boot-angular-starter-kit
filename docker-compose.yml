# One command to run the whole stack: `docker compose up`
# Postgres + API + (optional) pgAdmin. The Angular dev server runs on the host.
services:
  db:
    image: postgres:16-alpine
    container_name: starterkit-db
    environment:
      POSTGRES_DB: ${DB_NAME:-starterkit}
      POSTGRES_USER: ${DB_USERNAME:-starterkit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-starterkit}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-starterkit} -d ${DB_NAME:-starterkit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: starterkit-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-starterkit}
      DB_USERNAME: ${DB_USERNAME:-starterkit}
      DB_PASSWORD: ${DB_PASSWORD:-starterkit}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - see .env.example}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  db-data:
